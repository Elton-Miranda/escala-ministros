<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Escala dos Ministros</title>
  <meta name="description" content="Consulte quando e onde você serve como Ministro Extraordinário da Sagrada Comunhão.">
  <meta name="theme-color" content="#264C78">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Escala">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/ministro.css">
</head>
<body>
  <header class="topo">
    <div class="wrap">
      <img class="logo" src="assets/img/logo.svg" alt="">
      <div>
        <div class="nome-app">Escala dos Ministros</div>
        <div class="paroquia" id="paroquia">Paróquia São Paulo Apóstolo</div>
      </div>
    <nav class="nav" aria-label="Seções">
      <button data-act="ir" data-v="inicio" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        Minha escala
      </button>
      <button data-act="ir" data-v="escala">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Escala do mês
      </button>
      <button data-act="ir" data-v="ajuda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></svg>
        Ajuda
      </button>
    </nav>
    </div>
  </header>
  <main id="app" class="wrap">
    <div class="loading"><div><img src="assets/img/logo.svg" alt=""><p>Carregando a escala…</p></div></div>
  </main>
  <noscript><p class="wrap">Para ver a escala, ative o JavaScript do navegador.</p></noscript>
  <script type="module" src="assets/js/ministro/app.js"></script>
</body>
</html>
